name: g6-assurance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  machine-assurance:
    runs-on: ubuntu-latest
    env:
      FOSSIL_SHA: b5fd57725c910b149910371964adb35d9280016e
      FOSSIL_SCHEMA_ROOT: /tmp/fossil-core/schemas
      MULTIWOZ_SHA: fe0c8e65cfcd8462bd33c86e35f21addc84ca82b
      MULTIWOZ_ROOT: /tmp/multiwoz/data/MultiWOZ_2.2
      G6_MUTATION_RECEIPT_PATH: /tmp/g6-mutation-receipt.json
      G6_SIMULATOR_RECEIPT_PATH: /tmp/g6-simulator-receipt.json
      G6_DIALOGUE_BASELINE_RECEIPT_PATH: /tmp/g6-dialogue-baseline-receipt.json
      G6_CORPUS_TRANSITION_RECEIPT_PATH: /tmp/g6-corpus-transition-receipt.json
      G6_UTTERANCE_BRIDGE_RECEIPT_PATH: /tmp/g6-utterance-bridge-receipt.json
      G6_STYLE_MODEL_RECEIPT_PATH: /tmp/g6-style-model-receipt.json
      G6_DERIVED_STYLE_MODEL_PATH: /tmp/g6-derived-style-model.json
      G6_MACHINE_RECEIPT_PATH: /tmp/g6-machine-receipt.json
      G6_CHECKED_OUT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      G6_CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$G6_CHECKED_OUT_REVISION"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web workspace
        run: pnpm install --no-frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API development dependencies
        run: python -m pip install -e 'services/portfolio-ai[dev]'

      - name: Checkout exact FOSSIL schemas
        run: |
          git init /tmp/fossil-core
          git -C /tmp/fossil-core remote add origin https://github.com/Pukujan/fossil-core.git
          git -C /tmp/fossil-core fetch --depth=1 origin "$FOSSIL_SHA"
          git -C /tmp/fossil-core checkout --detach FETCH_HEAD
          test "$(git -C /tmp/fossil-core rev-parse HEAD)" = "$FOSSIL_SHA"

      - name: Architecture and shared contract guards
        run: |
          python scripts/check_architecture.py
          python scripts/validate_contracts.py

      - name: Cross-gate deterministic and property tests
        run: |
          python -m pytest -q \
            services/portfolio-ai/tests/test_fossil_pack.py \
            services/portfolio-ai/tests/test_conversation_kernel.py \
            services/portfolio-ai/tests/test_response_cache.py \
            services/portfolio-ai/tests/test_cache_authority.py \
            services/portfolio-ai/tests/test_g6_assurance.py \
            services/portfolio-ai/tests/test_g6_adversarial.py \
            services/portfolio-ai/tests/test_g6_dialogue_behavior.py \
            services/portfolio-ai/tests/test_g6_multiwoz_transitions.py \
            services/portfolio-ai/tests/test_g6_multiwoz_utterance_bridge.py \
            services/portfolio-ai/tests/test_g6_style_model.py \
            services/portfolio-ai/tests/test_api.py

      - name: Hands-free, latency and UI behavior tests
        run: pnpm --filter @handsfree/web test

      - name: Deterministic persona workload
        run: python scripts/run_g6_simulator.py

      - name: Establish corpus-backed dialogue baseline
        run: python scripts/verify_g6_dialogue_baseline.py

      - name: Checkout pinned MultiWOZ 2.2 research corpus
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/budzianowski/multiwoz.git /tmp/multiwoz
          git -C /tmp/multiwoz fetch --depth=1 origin "$MULTIWOZ_SHA"
          git -C /tmp/multiwoz sparse-checkout init --no-cone
          printf '/LICENSE\n/data/MultiWOZ_2.2/dev/\n/data/MultiWOZ_2.2/test/\n/data/MultiWOZ_2.2/dialog_acts.json\n' > /tmp/multiwoz/.git/info/sparse-checkout
          git -C /tmp/multiwoz checkout --detach FETCH_HEAD
          test "$(git -C /tmp/multiwoz rev-parse HEAD)" = "$MULTIWOZ_SHA"

      - name: Measure human dialogue transition graph
        run: python scripts/verify_g6_multiwoz_transitions.py

      - name: Measure deterministic utterance-to-act bridge
        run: python scripts/verify_g6_multiwoz_utterance_bridge.py

      - name: Distill compact corpus-derived style model
        run: python scripts/build_g6_style_model.py

      - name: Kill critical production-source mutants
        run: python scripts/verify_g6_mutations.py

      - name: Emit machine-assurance / corpus-qualification receipt
        run: python scripts/verify_g6_machine.py

      - name: Upload G6 machine receipts
        uses: actions/upload-artifact@v4
        with:
          name: g6-machine-assurance-receipts
          path: |
            /tmp/g6-*-receipt.json
            /tmp/g6-derived-style-model.json
          if-no-files-found: error
          retention-days: 30
