name: g5-response-cache

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-safe-cache:
    runs-on: ubuntu-latest
    env:
      FOSSIL_SHA: b5fd57725c910b149910371964adb35d9280016e
      FOSSIL_SCHEMA_ROOT: /tmp/fossil-core/schemas
      G5_RECEIPT_PATH: /tmp/g5-cache-receipt.json
      G5_REDACTION_RECEIPT_PATH: /tmp/g5-redaction-receipt.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API development dependencies
        run: python -m pip install -e 'services/portfolio-ai[dev]'

      - name: Checkout exact FOSSIL schemas
        run: |
          git init /tmp/fossil-core
          git -C /tmp/fossil-core remote add origin https://github.com/Pukujan/fossil-core.git
          git -C /tmp/fossil-core fetch --depth=1 origin "$FOSSIL_SHA"
          git -C /tmp/fossil-core checkout --detach FETCH_HEAD
          test "$(git -C /tmp/fossil-core rev-parse HEAD)" = "$FOSSIL_SHA"

      - name: Architecture boundary guard
        run: python scripts/check_architecture.py

      - name: Shared contract validation
        run: python scripts/validate_contracts.py

      - name: G3 regression plus cache authority and mutation-target tests
        run: python -m pytest services/portfolio-ai/tests/test_conversation_kernel.py services/portfolio-ai/tests/test_response_cache.py services/portfolio-ai/tests/test_cache_authority.py services/portfolio-ai/tests/test_api.py

      - name: Live exact-source FOSSIL cache verification
        run: python scripts/verify_g5_cache.py

      - name: Live FOSSIL redaction invalidation verification
        run: python scripts/verify_g5_redaction.py

      - name: Upload G5 verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: g5-response-cache-receipts
          path: /tmp/g5-*-receipt.json
          if-no-files-found: error
          retention-days: 30
