name: g2-retrieval-benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval-benchmark:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.06.0
        env:
          NEO4J_AUTH: neo4j/portfolio-test-password
        ports:
          - 7687:7687
    env:
      FOSSIL_SHA: b5fd57725c910b149910371964adb35d9280016e
      FOSSIL_SCHEMA_ROOT: /tmp/fossil-core/schemas
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: portfolio-test-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API development dependencies
        run: python -m pip install -e 'services/portfolio-ai[dev]'

      - name: Checkout exact FOSSIL schemas
        run: |
          git init /tmp/fossil-core
          git -C /tmp/fossil-core remote add origin https://github.com/Pukujan/fossil-core.git
          git -C /tmp/fossil-core fetch --depth=1 origin "$FOSSIL_SHA"
          git -C /tmp/fossil-core checkout --detach FETCH_HEAD
          test "$(git -C /tmp/fossil-core rev-parse HEAD)" = "$FOSSIL_SHA"

      - name: Architecture boundary guard
        run: python scripts/check_architecture.py

      - name: Retrieval policy unit benchmark
        run: python -m pytest services/portfolio-ai/tests/test_retrieval.py

      - name: Live FOSSIL retrieval and graph incremental-value benchmark
        run: python scripts/verify_g2_retrieval.py
