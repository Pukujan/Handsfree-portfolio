name: g1-public-knowledge

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-knowledge:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.07.0
        env:
          NEO4J_AUTH: neo4j/portfolio-test-password
        ports:
          - 7687:7687
    env:
      FOSSIL_SHA: b5fd57725c910b149910371964adb35d9280016e
      FOSSIL_SCHEMA_ROOT: /tmp/fossil-core/schemas
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: portfolio-test-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API development dependencies with pinned FOSSIL
        run: python -m pip install -e 'services/portfolio-ai[dev]'

      - name: Checkout exact FOSSIL schemas
        run: |
          git init /tmp/fossil-core
          git -C /tmp/fossil-core remote add origin https://github.com/Pukujan/fossil-core.git
          git -C /tmp/fossil-core fetch --depth=1 origin "$FOSSIL_SHA"
          git -C /tmp/fossil-core checkout --detach FETCH_HEAD
          test "$(git -C /tmp/fossil-core rev-parse HEAD)" = "$FOSSIL_SHA"

      - name: Foundation architecture guard
        run: python scripts/check_architecture.py

      - name: Shared contract validation
        run: python scripts/validate_contracts.py

      - name: Pinned-source, FOSSIL pack and graph-boundary tests
        run: python -m pytest services/portfolio-ai/tests/test_public_source.py services/portfolio-ai/tests/test_fossil_pack.py services/portfolio-ai/tests/test_neo4j_projection.py

      - name: Live exact-SHA ingestion, lifecycle replay and destructive Neo4j rebuild
        run: python scripts/verify_g1_live.py
