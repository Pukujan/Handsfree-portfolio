name: g3-conversation-kernel

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversation-kernel:
    runs-on: ubuntu-latest
    env:
      FOSSIL_SHA: b5fd57725c910b149910371964adb35d9280016e
      FOSSIL_SCHEMA_ROOT: /tmp/fossil-core/schemas
      G3_RECEIPT_PATH: /tmp/g3-conversation-receipt.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API development dependencies
        run: python -m pip install -e 'services/portfolio-ai[dev]'

      - name: Checkout exact FOSSIL schemas
        run: |
          git init /tmp/fossil-core
          git -C /tmp/fossil-core remote add origin https://github.com/Pukujan/fossil-core.git
          git -C /tmp/fossil-core fetch --depth=1 origin "$FOSSIL_SHA"
          git -C /tmp/fossil-core checkout --detach FETCH_HEAD
          test "$(git -C /tmp/fossil-core rev-parse HEAD)" = "$FOSSIL_SHA"

      - name: Architecture boundary guard
        run: python scripts/check_architecture.py

      - name: Shared contract validation
        run: python scripts/validate_contracts.py

      - name: Conversation kernel and SSE delivery tests
        run: python -m pytest services/portfolio-ai/tests/test_conversation_kernel.py services/portfolio-ai/tests/test_api.py

      - name: Live exact-source grounded Slice-1 conversation
        run: python scripts/verify_g3_conversation.py

      - name: Upload G3 verification receipt
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: g3-conversation-receipt
          path: /tmp/g3-conversation-receipt.json
          if-no-files-found: error
          retention-days: 30
