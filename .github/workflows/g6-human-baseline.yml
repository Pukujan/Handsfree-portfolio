name: g6-human-baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simple-text-baseline:
    runs-on: ubuntu-latest
    env:
      BASELINE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact baseline checkout
        run: test "$(git rev-parse HEAD)" = "$BASELINE_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API development dependencies
        run: python -m pip install -e 'services/portfolio-ai[dev]'

      - name: Verify simple-text baseline contract
        run: python -m pytest -q services/portfolio-ai/tests/test_g6_human_baseline.py
