name: g4-hands-free-ux

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hands-free-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Architecture boundary guard
        run: python scripts/check_architecture.py

      - name: Hands-free controller, SSE and UI tests
        run: pnpm --filter @handsfree/web test

      - name: Production web build
        run: pnpm --filter @handsfree/web build
