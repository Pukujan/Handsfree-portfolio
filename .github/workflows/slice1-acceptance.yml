name: slice1-acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      FOSSIL_SHA: b5fd57725c910b149910371964adb35d9280016e
      FOSSIL_SCHEMA_ROOT: /tmp/fossil-core/schemas
      PORTFOLIO_SITE_ADDRESS: http://localhost
      PORTFOLIO_PACK_ROOT_HOST: /tmp/slice1-portfolio-public
      PORTFOLIO_CACHE_MAX_ENTRIES: "256"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SLICE1_BASE_URL: http://localhost
      SLICE1_RECEIPT_PATH: /tmp/slice1-machine-receipt.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API development dependencies
        run: python -m pip install -e 'services/portfolio-ai[dev]'

      - name: Checkout exact FOSSIL schemas
        run: |
          git init /tmp/fossil-core
          git -C /tmp/fossil-core remote add origin https://github.com/Pukujan/fossil-core.git
          git -C /tmp/fossil-core fetch --depth=1 origin "$FOSSIL_SHA"
          git -C /tmp/fossil-core checkout --detach FETCH_HEAD
          test "$(git -C /tmp/fossil-core rev-parse HEAD)" = "$FOSSIL_SHA"

      - name: Architecture and contract guards
        run: |
          python scripts/check_architecture.py
          python scripts/validate_contracts.py

      - name: Materialize real public FOSSIL pack
        run: |
          rm -rf "$PORTFOLIO_PACK_ROOT_HOST"
          python scripts/g7_public_pack.py materialize \
            --schema-root "$FOSSIL_SCHEMA_ROOT" \
            --output "$PORTFOLIO_PACK_ROOT_HOST" \
            > /tmp/slice1-materialize-receipt.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @handsfree/web exec playwright install --with-deps chromium

      - name: Build production topology
        run: docker compose -f deploy/compose.production.yml build

      - name: Exact two-turn production Slice-1 journey
        run: |
          fail() {
            echo "--- docker compose ps ---"
            docker compose -f deploy/compose.production.yml ps || true
            echo "--- docker compose logs ---"
            docker compose -f deploy/compose.production.yml logs --no-color || true
            exit 1
          }
          cleanup() { docker compose -f deploy/compose.production.yml down -v --remove-orphans || true; }
          trap cleanup EXIT

          docker compose -f deploy/compose.production.yml up -d
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost/health >/tmp/slice1-health.json \
              && grep -q '"status":"ok"' /tmp/slice1-health.json; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true || fail

          pnpm --filter @handsfree/web exec playwright test \
            acceptance/slice1-production.spec.ts \
            --config=playwright.slice1.config.ts || fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slice1-acceptance-receipts-${{ github.run_id }}
          path: |
            /tmp/slice1-materialize-receipt.json
            /tmp/slice1-machine-receipt.json
          if-no-files-found: warn
