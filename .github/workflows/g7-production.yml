name: g7-production

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    env:
      FOSSIL_SHA: b5fd57725c910b149910371964adb35d9280016e
      FOSSIL_SCHEMA_ROOT: /tmp/fossil-core/schemas
      PORTFOLIO_SITE_ADDRESS: http://localhost
      PORTFOLIO_PACK_ROOT_HOST: /tmp/g7-portfolio-public
      PORTFOLIO_CACHE_MAX_ENTRIES: "256"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API development dependencies
        run: python -m pip install -e 'services/portfolio-ai[dev]'

      - name: Checkout exact FOSSIL schemas
        run: |
          git init /tmp/fossil-core
          git -C /tmp/fossil-core remote add origin https://github.com/Pukujan/fossil-core.git
          git -C /tmp/fossil-core fetch --depth=1 origin "$FOSSIL_SHA"
          git -C /tmp/fossil-core checkout --detach FETCH_HEAD
          test "$(git -C /tmp/fossil-core rev-parse HEAD)" = "$FOSSIL_SHA"

      - name: Existing architecture and contract guards
        run: |
          python scripts/check_architecture.py
          python scripts/validate_contracts.py

      - name: Verify bounded API observability contract
        run: python -m pytest services/portfolio-ai/tests/test_api.py -q

      - name: Verify production attack surface and dependency boundary
        run: python scripts/verify_g7_topology.py --receipt /tmp/g7-topology-receipt.json

      - name: Verify deterministic materialization and destructive recovery
        run: python scripts/verify_g7_recovery.py --schema-root "$FOSSIL_SCHEMA_ROOT" --receipt /tmp/g7-recovery-receipt.json

      - name: Materialize production pack for container smoke test
        run: |
          rm -rf "$PORTFOLIO_PACK_ROOT_HOST"
          python scripts/g7_public_pack.py materialize \
            --schema-root "$FOSSIL_SCHEMA_ROOT" \
            --output "$PORTFOLIO_PACK_ROOT_HOST" \
            > /tmp/g7-materialize-receipt.json
          python scripts/g7_public_pack.py bundle \
            --pack-root "$PORTFOLIO_PACK_ROOT_HOST" \
            --output /tmp/g7-portfolio-public.zip \
            > /tmp/g7-bundle-receipt.json

      - name: Validate compose configuration
        run: docker compose -f deploy/compose.production.yml config >/tmp/g7-compose-rendered.yml

      - name: Generate exact workspace lockfile candidate
        run: |
          npm install --global pnpm@10.15.1
          pnpm install --lockfile-only
          test -s pnpm-lock.yaml
          pnpm install --lockfile-only --frozen-lockfile

      - uses: actions/upload-artifact@v4
        with:
          name: g7-pnpm-lock-${{ github.run_id }}
          path: pnpm-lock.yaml
          if-no-files-found: error

      - name: Build minimal production images
        run: docker compose -f deploy/compose.production.yml build

      - name: Prove production API image excludes Neo4j client
        run: |
          docker compose -f deploy/compose.production.yml run --rm --no-deps api \
            python -c "import importlib.util; assert importlib.util.find_spec('neo4j') is None"

      - name: Production edge and grounded-answer smoke test
        run: |
          cleanup() { docker compose -f deploy/compose.production.yml down -v --remove-orphans || true; }
          trap cleanup EXIT
          docker compose -f deploy/compose.production.yml up -d
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost/health >/tmp/g7-health.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/g7-health.json
          curl -fsS http://localhost/ >/tmp/g7-index.html
          grep -q 'id="root"' /tmp/g7-index.html
          curl -fsS -N \
            -H 'Content-Type: application/json' \
            -H 'Accept: text/event-stream' \
            -H 'X-Request-ID: g7-container-before-restart' \
            --data '{"question":"What is FOSSIL?"}' \
            http://localhost/v1/conversations/g7-container-before-restart/turns \
            >/tmp/g7-sse-before.txt
          grep -q 'event: answer.grounded' /tmp/g7-sse-before.txt
          grep -q 'event: turn.complete' /tmp/g7-sse-before.txt

          docker compose -f deploy/compose.production.yml restart api
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -N \
            -H 'Content-Type: application/json' \
            -H 'Accept: text/event-stream' \
            -H 'X-Request-ID: g7-container-after-restart' \
            --data '{"question":"What is FOSSIL?"}' \
            http://localhost/v1/conversations/g7-container-after-restart/turns \
            >/tmp/g7-sse-after.txt
          grep -q 'event: answer.grounded' /tmp/g7-sse-after.txt
          grep -q 'event: turn.complete' /tmp/g7-sse-after.txt

      - name: Finalize G7 machine receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          topology = json.loads(Path('/tmp/g7-topology-receipt.json').read_text())
          recovery = json.loads(Path('/tmp/g7-recovery-receipt.json').read_text())
          receipt = {
              'workflowSha': os.environ['EXPECTED_SHA'],
              'status': 'G7_MACHINE_PASS',
              'topology': topology,
              'recovery': recovery,
              'observability': {
                  'boundedTerminalTurnSummary': True,
                  'requestIdEchoed': True,
                  'conversationIdHashed': True,
                  'rawQuestionLogged': False,
                  'rawVoiceLogged': False,
                  'retrievalLaneCaptured': True,
                  'cacheHitAndRevalidationCaptured': True,
                  'claimAndEvidenceIdsCaptured': True,
              },
              'containerSmoke': {
                  'sameOriginEdge': True,
                  'healthThroughCaddy': True,
                  'staticSiteThroughCaddy': True,
                  'groundedSseBeforeRestart': True,
                  'groundedSseAfterRestart': True,
                  'neo4jClientInApiImage': False,
              },
              'graphServiceDeployed': False,
              'objectStoreCredentialsInPublicRuntime': False,
          }
          Path('/tmp/g7-machine-receipt.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g7-production-receipts-${{ github.run_id }}
          path: |
            /tmp/g7-topology-receipt.json
            /tmp/g7-recovery-receipt.json
            /tmp/g7-materialize-receipt.json
            /tmp/g7-bundle-receipt.json
            /tmp/g7-machine-receipt.json
          if-no-files-found: error
