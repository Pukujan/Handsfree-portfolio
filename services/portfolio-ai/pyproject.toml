[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "handsfree-portfolio-ai"
version = "0.1.0"
description = "Bounded conversation service for Handsfree Portfolio"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "fossil-core @ git+https://github.com/Pukujan/fossil-core.git@b5fd57725c910b149910371964adb35d9280016e"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "hypothesis>=6,<7",
  "httpx>=0.27,<1",
  "jsonschema>=4,<5"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/handsfree_portfolio"]
